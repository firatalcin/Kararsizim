{% load static %}<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Kararsızım{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Kararsız mı kaldın? Hızlıca anket aç, herkes oy versin.{% endblock %}">
  <link rel="icon" href="{% static 'img/logo-mark.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"></div>

  {% include "partials/_navbar.html" %}

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/_messages.html" %}

  <script src="{% static 'js/main.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
