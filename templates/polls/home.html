{% extends "base.html" %}

{% block content %}
<section class="hero">
  <div class="hero__emoji" aria-hidden="true">🤔</div>
  <h1 class="hero__title">Kararsızım yakında burada</h1>
  <p class="hero__text">Kararsız kaldığın her şeyi sor, herkes oy versin. Şimdilik hazırlanıyoruz.</p>
  <div class="demo-card card">
    <p class="demo-card__question">Bu akşam sinema mı, restoran mı?</p>
    <div class="demo-card__options">
      <span class="chip chip--violet">Sinema</span>
      <span class="chip chip--pink">Restoran</span>
      <span class="chip chip--orange">Evde film</span>
    </div>
  </div>
</section>
{% endblock %}
