<header class="navbar">
  <div class="container navbar__inner">
    <a href="/" class="logo" aria-label="Kararsızım ana sayfa">
      <span class="logo__word">Kararsızım</span><svg class="logo__mark" viewBox="0 0 24 34" width="15" height="22" aria-hidden="true" focusable="false"><path d="M5 10a7 7 0 1 1 10.6 6c-2.3 1.3-3.6 2.7-3.6 5.2v1.3" fill="none" stroke="currentColor" stroke-width="5.4" stroke-linecap="round"/><circle cx="12" cy="29.8" r="3.4" fill="currentColor"/></svg>
    </a>
    <nav class="navbar__actions" aria-label="Hesap">
      {% if user.is_authenticated %}
        <a href="/anket/yeni/" class="btn btn--primary btn--sm" aria-label="Anket oluştur">
          <span aria-hidden="true">+</span><span class="hide-sm">Anket oluştur</span>
        </a>
        <a class="navbar__user" href="{% url 'polls:profile' user.username %}" title="Profilin: @{{ user.username }}">@{{ user.username }}</a>
        <form method="post" action="{% url 'accounts:logout' %}" class="navbar__logout">
          {% csrf_token %}
          <button type="submit" class="link-button">Çıkış</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}{% if request.path != '/' and request.path != '/giris/' and request.path != '/kayit/' %}?next={{ request.get_full_path|urlencode }}{% endif %}" class="navbar__link">Giriş yap</a>
        <a href="{% url 'accounts:register' %}" class="btn btn--primary btn--sm">Kayıt ol</a>
      {% endif %}
    </nav>
  </div>
</header>
